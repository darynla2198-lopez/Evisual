# Crea el instalador de Windows y lo publica en GitHub Releases.
# Para lanzar una versión: sube la versión en package.json, sw.js y version.json,
# y crea una etiqueta (git tag v1.0.1 && git push origin v1.0.1),
# o pulsa "Run workflow" en la pestaña Actions y la etiqueta se crea sola.
name: Instalador de Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --win --publish never
      - name: Publicar en GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          node -e "const v=process.argv[1],j=require('./version.json'),r=(j.notes||[]).find(n=>n.v===v);require('fs').writeFileSync('notas.md',(r?r.n.map(x=>'- '+x).join('\\n'):'Evisual '+v)+'\\n')" "$V"
          if ! gh release view "v$V" >/dev/null 2>&1; then
            gh release create "v$V" --title "Evisual $V" --notes-file notas.md --target "$GITHUB_SHA"
          fi
          gh release upload "v$V" "dist/Evisual-Setup-$V.exe" "dist/Evisual-Setup-$V.exe.blockmap" dist/latest.yml --clobber
          gh release edit "v$V" --title "Evisual $V" --notes-file notas.md --latest
      - uses: actions/upload-artifact@v4
        with:
          name: Evisual-instalador
          path: dist/*.exe

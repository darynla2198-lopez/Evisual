# Crea el instalador de Windows y lo publica en GitHub Releases.
# Para lanzar una versión: sube la versión en package.json, sw.js y version.json,
# y crea una etiqueta (git tag v1.0.1 && git push origin v1.0.1),
# o pulsa "Run workflow" en la pestaña Actions y la etiqueta se crea sola.
name: Instalador de Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Crear la etiqueta de la versión si se lanzó a mano
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            git tag "v$V" && git push origin "v$V"
          fi
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Evisual-instalador
          path: dist/*.exe
